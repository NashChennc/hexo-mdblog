# ============================================
# mdblog 主题配置文件
# ============================================
# 配置文件位置: themes/mdblog/_config.yml
# 
# 配置优先级说明：
# 1. 主题配置 (theme.xxx) - 最高优先级
# 2. 站点配置 (config.xxx) - 次优先级  
# 3. i18n文本 (__('key')) - 用于界面文本
# 4. 硬编码默认值 - 最后兜底
# ============================================

# ============================================
# 一、Banner 配置（首页及分类页顶部横幅）
# ============================================
# Banner 显示在首页和分类页的顶部，支持自定义标题、副标题和背景图
# ============================================
banner:
  # 是否启用 Banner
  # 类型: Boolean
  # 默认值: true
  enable: true
  
  # Banner 背景图片路径
  # 类型: String
  # 默认值: /image/banner.png
  # 说明: 图片应放在 source/image/ 目录下，或使用绝对路径
  # 提示: 主题会自动从 source/image/banner/ 目录随机选择图片作为首页背景
  image: /image/banner.png
  
  # Banner 标题（用户可定制内容）
  # 类型: String
  # 默认值: "" (留空则使用站点标题 config.title)
  # 说明: 这是用户个性化内容，不会进行国际化
  # 示例: "Welcome to My Blog"
  title: ""
  
  # Banner 副标题（用户可定制内容）
  # 类型: String
  # 默认值: "" (留空则使用站点副标题 config.subtitle)
  # 说明: 这是用户个性化内容，不会进行国际化
  # 示例: "A simple and clean blog theme"
  subtitle: ""

# ============================================
# 二、侧边栏配置
# ============================================
# 侧边栏显示在文章页和首页右侧，包含用户信息卡片
# ============================================
sidebar_config:
  # 侧边栏卡片背景图
  # 类型: String
  # 默认值: /image/card.png
  # 说明: 图片应放在 source/image/ 目录下
  image: /image/card.png
  
  # 头像图片路径
  # 类型: String
  # 默认值: /image/avatar.jpeg
  # 说明: 如果未设置，将显示默认图标
  # 提示: 建议使用正方形图片，会自动裁剪为圆形
  avatar: /image/avatar.jpeg
  
  # 侧边栏描述（用户可定制内容）
  # 类型: String
  # 默认值: "" (留空则使用站点描述 config.description，再为空则使用i18n默认值)
  # 说明: 这是用户个性化内容，不会进行国际化
  # 优先级: theme.sidebar_config.description > config.description > __('welcome')
  description: ""

# ============================================
# 三、社交链接配置
# ============================================
# 在侧边栏底部显示社交链接图标
# 支持多个社交平台，每个平台包含 link、icon、color 三个属性
# ============================================
social:
  # 邮箱链接示例
  email:
    # 链接地址
    # 类型: String
    # 格式: mailto:your@email.com 或 https://...
    link: mailto:your@email.com
    
    # Material Icons 图标名称
    # 类型: String
    # 参考: https://fonts.google.com/icons
    # 常用图标: email, code, link, share, favorite, etc.
    icon: email
    
    # MDUI 颜色类名
    # 类型: String
    # 格式: mdui-text-color-{颜色名}
    # 可用颜色: blue, red, green, orange, purple, pink, indigo, teal, cyan, etc.
    # 参考: https://www.mdui.org/docs/color
    color: mdui-text-color-blue
  
  # GitHub 链接示例
  github:
    link: https://github.com/yourusername
    icon: code
    color: mdui-text-color-black
  
  # 可以添加更多社交链接...
  # twitter:
  #   link: https://twitter.com/yourusername
  #   icon: share
  #   color: mdui-text-color-blue
  # 
  # weibo:
  #   link: https://weibo.com/yourusername
  #   icon: favorite
  #   color: mdui-text-color-red

# ============================================
# 四、其他配置项
# ============================================
# 以下配置项保留用于兼容性，部分可能未在当前版本使用
# ============================================

# RSS 订阅链接
# 类型: String
# 默认值: /atom.xml
rss: /atom.xml

# 文章摘要链接文本（当前未使用）
# 类型: String
# 默认值: Read More
excerpt_link: Read More

# 网站图标路径
# 类型: String
# 默认值: /favicon.png
favicon: /favicon.png

# ============================================
# 五、Hexo 内置配置（保留用于兼容性）
# ============================================
# 以下配置项是 Hexo 主题的标准配置，保留以兼容其他主题
# 注意: 部分配置项在当前主题中可能未使用
# ============================================

# Header 菜单配置（当前未在 topbar 中使用）
# 注意: topbar 中的菜单项是硬编码的，如需修改请编辑 layout/partial/topbar.ejs
menu:
  Home: /
  Categories: /categories
  Archives: /archives
  About: /about

# Content 配置
fancybox: true

# Sidebar 配置（当前未使用）
sidebar: right
widgets:
#- category
#- tag
#- tagcloud
#- archive
#- recent_posts

# 索引页小部件配置（当前未使用）
index_widgets:
# - category
# - tagcloud
# - archive

# 小部件行为配置（当前未使用）
archive_type: 'monthly'
show_count: false

# 分析工具配置（当前未使用）
google_analytics:
gauges_analytics:
twitter:
google_plus:
fb_admins:
fb_app_id:

# 字数统计配置
symbols_count_time:
  separated_meta: true
  item_text_post: true
  item_text_total: false
  awl: 2
  wpm: 275

# 索引生成器配置
index_generator:
  path: ''
  per_page: 10
  order_by: -updated  # 关键：按 updated 倒序排列

# ============================================
# 六、Markdown 渲染器配置
# ============================================
# 解决一级标题无法跳转的问题
# ============================================
markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    typographer: true
    quotes: '""'''
  plugins:
    - markdown-it-anchor      # 启用锚点生成插件
    - markdown-it-toc-done-right # 可选
  anchors:
    level: 1                  # 【关键修改】从 1 (H1) 开始生成 ID，默认为 2
    collisionSuffix: ''
    permalink: false          # 是否在标题旁显示 ¶ 符号，按需开启
    permalinkClass: header-anchor
    permalinkSymbol: ¶
