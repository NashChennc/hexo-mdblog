# ============================================
# 四、其他配置项
# ============================================
# 以下配置项保留用于兼容性，部分可能未在当前版本使用
# ============================================

# RSS 订阅链接
# 类型: String
# 默认值: /atom.xml
rss: /atom.xml

# 文章摘要链接文本（当前未使用）
# 类型: String
# 默认值: Read More
excerpt_link: Read More

# 网站图标路径
# 类型: String
# 默认值: /favicon.png
favicon: /favicon.png

# ============================================
# 五、Hexo 内置配置（保留用于兼容性）
# ============================================
# 以下配置项是 Hexo 主题的标准配置，保留以兼容其他主题
# 注意: 部分配置项在当前主题中可能未使用
# ============================================

# Header 菜单配置（当前未在 topbar 中使用）
# 注意: topbar 中的菜单项是硬编码的，如需修改请编辑 layout/partial/topbar.ejs
menu:
  Home: /
  Categories: /categories
  Archives: /archives
  About: /about

# Content 配置
fancybox: true

# Sidebar 配置（当前未使用）
sidebar: right
widgets:
#- category
#- tag
#- tagcloud
#- archive
#- recent_posts

# 索引页小部件配置（当前未使用）
index_widgets:
# - category
# - tagcloud
# - archive

# 小部件行为配置（当前未使用）
archive_type: 'monthly'
show_count: false

# 分析工具配置（当前未使用）
google_analytics:
gauges_analytics:
twitter:
google_plus:
fb_admins:
fb_app_id:

# 字数统计配置
symbols_count_time:
  separated_meta: true
  item_text_post: true
  item_text_total: false
  awl: 2
  wpm: 275

# 索引生成器配置
index_generator:
  path: ''
  per_page: 10
  order_by: -updated  # 关键：按 updated 倒序排列

# ============================================
# 六、Markdown 渲染器配置
# ============================================
# 解决一级标题无法跳转的问题
# ============================================
markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    typographer: true
    quotes: '""'''
  plugins:
    - markdown-it-anchor      # 启用锚点生成插件
    - markdown-it-toc-done-right # 可选
  anchors:
    level: 1                  # 【关键修改】从 1 (H1) 开始生成 ID，默认为 2
    collisionSuffix: ''
    permalink: false          # 是否在标题旁显示 ¶ 符号，按需开启
    permalinkClass: header-anchor
    permalinkSymbol: ¶
