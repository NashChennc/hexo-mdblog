# Header
menu:
  Home: /
  Categories: /categories
  Archives: /archives
  About: /about
rss: /atom.xml

# Content
excerpt_link: Read More
fancybox: true

# Sidebar
sidebar: right
widgets:
#- category
#- tag
#- tagcloud
#- archive
#- recent_posts

# display widgets at the bottom of index pages (pagination == 2)
index_widgets:
# - category
# - tagcloud
# - archive

# widget behavior
archive_type: 'monthly'
show_count: false

# Miscellaneous
google_analytics:
gauges_analytics:
favicon: /favicon.png
twitter:
google_plus:
fb_admins:
fb_app_id:

symbols_count_time:
  separated_meta: true
  item_text_post: true
  item_text_total: false
  awl: 2
  wpm: 275

index_generator:
  path: ''
  per_page: 10
  order_by: -updated  # 关键：按 updated 倒序排列
# --------------------------------------------------------
# Markdown-it 渲染器配置 (解决一级标题无法跳转的问题)
# --------------------------------------------------------
markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    typographer: true
    quotes: '“”‘’'
  plugins:
    - markdown-it-anchor      # 启用锚点生成插件
    - markdown-it-toc-done-right # 可选
  anchors:
    level: 1                  # 【关键修改】从 1 (H1) 开始生成 ID，默认为 2
    collisionSuffix: ''
    permalink: false          # 是否在标题旁显示 ¶ 符号，按需开启
    permalinkClass: header-anchor
    permalinkSymbol: ¶

